<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 490" width="880" height="490" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="title">Speed of hashing a string by its length, for each hasher</title>
<desc id="desc">Two line charts of the throughput in gigabytes per second of hashing a string of 1 to 65535 bytes, with both axes on a log scale: One for the hashers which pass SMHasher3 and one for those which do not. The numbers are in the tables of compare/readme.md.</desc>
