:root{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;--c5:#e87ba4;--c6:#008300;--c7:#6250d6;--c8:#e34948;--c9:#898781;}
@media (prefers-color-scheme: dark){:root{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#0ca30c;--c7:#9085e9;--c8:#e66767;--c9:#898781;}}
.surface{fill:var(--surface)}.title{fill:var(--ink);font-size:15px;font-weight:600}.sub{fill:var(--ink2);font-size:12px}.name{fill:var(--ink2);font-size:11px}.name.hl{fill:var(--ink);font-weight:600}.panel{fill:var(--ink);font-size:12px;font-weight:600}.tick{fill:var(--muted);font-size:10px;font-variant-numeric:tabular-nums}.grid{stroke:var(--grid);stroke-width:1}.minor{opacity:.55}.axis{stroke:var(--axis);stroke-width:1}.line{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.line.hl{stroke-width:3}.line.dash{stroke-dasharray:5 4}.halo{fill:none;stroke:var(--surface);stroke-width:5;stroke-linejoin:round}.lead{fill:none;stroke-width:1;opacity:.7}.c1{stroke:var(--c1)}.c2{stroke:var(--c2)}.c3{stroke:var(--c3)}.c4{stroke:var(--c4)}.c5{stroke:var(--c5)}.c6{stroke:var(--c6)}.c7{stroke:var(--c7)}.c8{stroke:var(--c8)}.c9{stroke:var(--c9)}
</style>
