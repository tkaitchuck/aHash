[package]
name = "ahash-compare"
version = "0.0.1"
authors = ["Tom Kaitchuck <Tom.Kaitchuck@gmail.com>"]
license = "MIT OR Apache-2.0"
description = "A hash algorithm benchmark"
documentation = "https://docs.rs/ahash"
repository = "https://github.com/tkaitchuck/ahash"
keywords = ["hash", "hashmap", "aes", "aes-ni", "no-std"]
edition = "2018"
readme = "README.md"

[features]
default = ["std"]
std = ["ahash/std"]
compile-time-rng = ["ahash/compile-time-rng"]
# For a nightly compiler: Turns on what the other hashers only do on nightly. (aHash detects nightly by itself.)
nightly = ["foldhash/nightly", "rapidhash/nightly", "rustc-hash/nightly"]

[[bench]]
name = "compare"
path = "tests/compare.rs"
harness = false

[profile.bench]
opt-level = 3
debug = false
lto = 'fat'
debug-assertions = false
codegen-units = 1

[dependencies]
ahash = { path = "../", default-features = false }
pcg-mwc = "0.2.1"
rand = "0.8.5"
rand_core = "0.6.4"

[dev-dependencies]
criterion = "0.8"
hashbrown = { version = "0.17", default-features = false }
fnv = "1.0.7"
foldhash = "0.2"
fxhash = "0.2.1"
rapidhash = "4.5"
rustc-hash = "2.1"
seahash = "4.1"
siphasher = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
